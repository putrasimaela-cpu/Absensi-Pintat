<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistem Absensi</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-card { background: #fff; border-radius: 10px; padding: 30px; width: 100%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
    h2 { margin-bottom: 5px; color: #333; }
    p { color: #666; margin-bottom: 20px; font-size: 14px; }
    .form-group { margin-bottom: 15px; text-align: left; }
    label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #444; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
    button { width: 100%; padding: 10px; background: #0d6efd; border: none; border-radius: 5px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
    button:hover { background: #0b5ed7; }
    #errorMsg { color: #dc3545; font-size: 13px; margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>

<div class="login-card">
  <h2>Sistem Absensi</h2>
  <p>Masukan Akun Pengguna</p>
  
  <form id="loginForm">
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" required placeholder="Masukkan username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" required placeholder="Masukkan password">
    </div>
    <button type="submit">Masuk</button>
  </form>
  
  <div id="errorMsg"></div>
</div>

<script>
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');
    
    errorMsg.innerText = "Menghubungkan ke server...";

    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    })
    .then(response => response.json().then(data => ({ status: response.status, body: data })))
    .then(res => {
      if (res.status === 200 && res.body.success) {
        localStorage.setItem('userSession', JSON.stringify(res.body.user));
        window.location.href = 'dashboard.html';
      } else {
        errorMsg.innerText = res.body.error || 'Username atau password salah!';
      }
    })
    .catch(err => {
      console.error(err);
      errorMsg.innerText = 'Gagal terhubung ke server.';
    });
  });
</script>

</body>
</html>
