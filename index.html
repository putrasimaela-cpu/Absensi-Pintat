<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistem Absensi Multi Sekolah</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: #eef2f5; }
    .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
    input { width: 100%; padding: 0.75rem; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 6px; }
    button { width: 100%; padding: 0.75rem; background: #0066ff; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .error { color: red; margin-top: 1rem; font-size: 0.85rem; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Sistem Absensi</h2>
    <p style="color:#666; font-size:0.85rem; margin-bottom:1.5rem;">Masukan Akun Pengguna</p>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit" id="submitBtn">Masuk</button>
    </form>
    <div id="errorMsg" class="error"></div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('errorMsg');
      err.textContent = '';

      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();

        if (res.ok) {
          // Simpan sesi user ke HP
          localStorage.setItem('userSession', JSON.stringify(data.user));
          window.location.href = '/dashboard.html';
        } else {
          err.textContent = data.error;
        }
      } catch (e) {
        err.textContent = 'Gagal terhubung ke server.';
      }
    });
  </script>
</body>
</html>
