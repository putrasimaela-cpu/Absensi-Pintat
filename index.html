<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Absensi Pintar</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-indigo-500 to-purple-600 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 space-y-6">
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full text-2xl mb-2">
                <i class="fa-solid fa-school"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">Sistem Absensi Sekolah</h1>
            <p class="text-sm text-gray-500">Silakan masuk menggunakan akun Anda</p>
        </div>

        <form id="formLogin" class="space-y-4">
            <div id="errorAlert" class="hidden p-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg flex items-center space-x-2">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="errorMessage">Username atau password salah!</span>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" id="username" required placeholder="Masukkan username..." 
                        class="w-full pl-10 pr-4 py-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="password" required placeholder="Masukkan password..." 
                        class="w-full pl-10 pr-4 py-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
            </div>

            <button type="submit" id="btnLogin" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md">
                Masuk Sistem
            </button>
        </form>

        <div class="text-center text-xs text-gray-400 pt-4 border-t">
            &copy; 2026 Sistem Absensi & Manajemen Sekolah
        </div>
    </div>

    <script>
        document.getElementById('formLogin').addEventListener('submit', async function(e) {
            e.preventDefault(); // Mencegah reload halaman secara default agar fetch API tereksekusi sempurna
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const btnLogin = document.getElementById('btnLogin');
            const errorAlert = document.getElementById('errorAlert');
            const errorMessage = document.getElementById('errorMessage');

            errorAlert.classList.add('hidden');
            btnLogin.disabled = true;
            btnLogin.innerText = 'Memproses...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    // Simpan sesi user ke localStorage
                    localStorage.setItem('user', JSON.stringify(result.user));
                    // Pindah ke dashboard (huruf kecil semua sesuai nama file fisik)
                    window.location.href = 'dashboard.html';
                } else {
                    errorAlert.classList.remove('hidden');
                    errorMessage.innerText = result.error || 'Username atau password salah!';
                    btnLogin.disabled = false;
                    btnLogin.innerText = 'Masuk Sistem';
                }
            } catch (err) {
                errorAlert.classList.remove('hidden');
                errorMessage.innerText = 'Terjadi kesalahan koneksi ke server.';
                btnLogin.disabled = false;
                btnLogin.innerText = 'Masuk Sistem';
            }
        });
    </script>
</body>
</html>
