<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner Presensi QR Code</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f6f9; }
    .card { background: white; max-width: 450px; margin: auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; }
    #status { margin-top: 15px; font-weight: bold; font-size: 1.1em; }
    .nav-btn { display: inline-block; margin-top: 15px; color: #0070f3; text-decoration: none; }
  </style>
</head>
<body>

<div class="card">
  <h2>Scanner Presensi Siswa</h2>
  <div id="reader"></div>
  <p id="status">Arahkan QR Code ke kamera...</p>
  <a href="/dashboard" class="nav-btn">Lihat Dashboard Presensi &rarr;</a>
</div>

<script>
  let isProcessing = false;

  function onScanSuccess(decodedText) {
    if (isProcessing) return;
    isProcessing = true;

    const statusEl = document.getElementById('status');
    statusEl.innerText = "Memproses: " + decodedText + "...";
    statusEl.style.color = "blue";

    fetch('/api/presensi', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nis: decodedText })
    })
    .then(res => res.json())
    .then(data => {
      statusEl.innerText = data.message;
      statusEl.style.color = data.success ? "green" : "red";
    })
    .catch(err => {
      statusEl.innerText = "Terjadi kesalahan sistem";
      statusEl.style.color = "red";
    })
    .finally(() => {
      // Tunggu 3 detik sebelum mengizinkan scan berikutnya
      setTimeout(() => { isProcessing = false; }, 3000);
    });
  }

  const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 250, height: 250 } });
  html5QrcodeScanner.render(onScanSuccess);
</script>

</body>
</html>
