<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Sistem Absensi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #f4f6f8; padding: 2rem; }
    .header { background: white; padding: 1.5rem; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.5rem; color: #333; }
    .btn-logout { background: #ff4d4d; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 0.9rem; }
    .content { margin-top: 2rem; background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  </style>
</head>
<body>

  <div class="header">
    <h1>Dashboard Absensi</h1>
    <a href="/index.html" class="btn-logout">Keluar</a>
  </div>

  <div class="content">
    <h2>Selamat Datang!</h2>
    <p style="margin-top: 0.5rem; color: #666;">Anda berhasil masuk ke Sistem Absensi Pintar.</p>
  </div>

</body>
</html>
