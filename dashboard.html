<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Presensi Hari Ini</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f6f9; }
    .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #0070f3; color: white; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    .header { display: flex; justify-content: space-between; align-items: center; }
    .btn { background: #0070f3; color: white; padding: 8px 15px; text-decoration: none; border-radius: 5px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>Rekap Presensi Hari Ini</h2>
    <a href="/" class="btn">&larr; Kamera Scanner</a>
  </div>

  <table>
    <thead>
      <tr>
        <th>No</th>
        <th>NIS</th>
        <th>Nama Siswa</th>
        <th>Kelas</th>
        <th>Jam Hadir</th>
      </tr>
    </thead>
    <tbody id="data-presensi">
      <tr><td colspan="5" style="text-align:center;">Memuat data...</td></tr>
    </tbody>
  </table>
</div>

<script>
  async function loadDashboardData() {
    try {
      const res = await fetch('/api/dashboard-data');
      const result = await res.json();
      
      const tbody = document.getElementById('data-presensi');
      tbody.innerHTML = '';

      if (result.data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Belum ada siswa presensi hari ini.</td></tr>';
        return;
      }

      result.data.forEach((row, index) => {
        const tr = `
          <tr>
            <td>${index + 1}</td>
            <td>${row.nis}</td>
            <td>${row.nama}</td>
            <td>${row.kelas}</td>
            <td>${row.jam} WITA</td>
          </tr>
        `;
        tbody.innerHTML += tr;
      });
    } catch (err) {
      console.error(err);
    }
  }

  // Muat data saat halaman dibuka & refresh tiap 5 detik
  loadDashboardData();
  setInterval(loadDashboardData, 5000);
</script>

</body>
</html>
