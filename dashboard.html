<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Absensi</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #f4f6f8; padding: 10px; }
    .header { background: #0052cc; color: white; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .nav-tabs { display: flex; gap: 5px; margin-bottom: 15px; overflow-x: auto; }
    .tab-btn { padding: 10px 12px; background: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; white-space: nowrap; }
    .tab-btn.active { background: #0052cc; color: white; }
    .card { background: white; padding: 15px; border-radius: 10px; display: none; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .card.active { display: block; }
    input, select, button { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; }
    button { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f8f9fa; }
    .badge { padding: 3px 8px; border-radius: 4px; background: #e0e0e0; font-size: 0.75rem; font-weight: bold; }
  </style>
</head>
<body>

  <!-- Header Otomatis Menyesuaikan Nama Sekolah -->
  <div class="header">
    <div>
      <h3 id="appTitle">SISTEM ABSENSI</h3>
      <small id="userInfo">Memuat Pengguna...</small>
    </div>
    <button onclick="logout()" style="width:auto; background:#ff4d4d; padding:6px 12px;">Keluar</button>
  </div>

  <!-- Menu Navigasi Berdasarkan Role -->
  <div class="nav-tabs" id="menuTabs">
    <button class="tab-btn active" onclick="switchTab('scanTab')">📷 Scan QR Guru Piket</button>
    <button class="tab-btn" onclick="switchTab('rekapTab')">📊 Rekap Absensi</button>
    <button class="tab-btn role-admin role-operator" onclick="switchTab('siswaTab')">👨‍🎓 Data Siswa</button>
    <button class="tab-btn role-admin" onclick="switchTab('userTab')">👤 Tata Kelola User</button>
    <button class="tab-btn role-admin" onclick="switchTab('sekolahTab')">🏫 Data Sekolah</button>
  </div>

  <!-- Tab 1: Scan QR Guru Piket (Mobile Friendly) -->
  <div id="scanTab" class="card active">
    <h3>Scanner QR Presensi (Guru Piket)</h3>
    <div id="reader" style="width:100%; max-width:350px; margin:10px auto;"></div>
    <div id="scanResult" style="text-align:center; font-weight:bold; margin-top:10px;"></div>
  </div>

  <!-- Tab 2: Rekap Absensi (Kepala Sekolah, Guru Piket, Admin, Operator) -->
  <div id="rekapTab" class="card">
    <h3>Rekap Kehadiran Siswa</h3>
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr><th>Tanggal</th><th>Nama Siswa</th><th>Kelas</th><th>Masuk</th><th>Pulang</th></tr>
        </thead>
        <tbody id="tabelRekap"></tbody>
      </table>
    </div>
  </div>

  <!-- Tab 3: Tambah Data Siswa + Banyak WA -->
  <div id="siswaTab" class="card">
    <h3>Tambah Data Siswa & Banyak No WA Ortu</h3>
    <form id="formSiswa">
      <input type="text" id="s_nisn" placeholder="NISN Siswa" required>
      <input type="text" id="s_nama" placeholder="Nama Lengkap Siswa" required>
      <input type="text" id="s_kelas" placeholder="Kelas (Contoh: X IPA 1)" required>
      <input type="text" id="s_ortu" placeholder="Nama Orang Tua" required>
      <input type="text" id="s_wa" placeholder="No WA Ortu (Pisahkan koma jika banyak: 62812..., 62852...)" required>
      <button type="submit">Simpan Data Siswa</button>
    </form>
    <div style="overflow-x:auto; margin-top:15px;">
      <table>
        <thead><tr><th>NISN</th><th>Nama</th><th>Kelas</th><th>No WA Ortu</th></tr></thead>
        <tbody id="tabelSiswa"></tbody>
      </table>
    </div>
  </div>

  <!-- Tab 4: Tata Kelola User & Role (Admin Only) -->
  <div id="userTab" class="card">
    <h3>Tambah Username, Password & Role User</h3>
    <form id="formUser">
      <input type="text" id="u_username" placeholder="Username" required>
      <input type="password" id="u_password" placeholder="Password" required>
      <input type="text" id="u_nama" placeholder="Nama Lengkap" required>
      <select id="u_role">
        <option value="operator">Operator</option>
        <option value="guru_piket">Guru Piket</option>
        <option value="kepala_sekolah">Kepala Sekolah</option>
      </select>
      <button type="submit">Daftarkan User</button>
    </form>
    <div style="overflow-x:auto; margin-top:15px;">
      <table>
        <thead><tr><th>Username</th><th>Nama</th><th>Role</th></tr></thead>
        <tbody id="tabelUser"></tbody>
      </table>
    </div>
  </div>

  <!-- Tab 5: Tambah Sekolah Baru (Multi-Tenant Admin Only) -->
  <div id="sekolahTab" class="card">
    <h3>Tambah Nama Sekolah Baru</h3>
    <form id="formSekolah">
      <input type="text" id="sek_nama" placeholder="Contoh: SMA Kristen Ameth" required>
      <input type="text" id="sek_alamat" placeholder="Alamat Sekolah">
      <button type="submit">Tambah Sekolah</button>
    </form>
    <div style="overflow-x:auto; margin-top:15px;">
      <table>
        <thead><tr><th>ID</th><th>Nama Sekolah</th></tr></thead>
        <tbody id="tabelSekolah"></tbody>
      </table>
    </div>
  </div>

  <script>
    const userSession = JSON.parse(localStorage.getItem('userSession'));
    if (!userSession) window.location.href = '/index.html';

    // Set Nama Sekolah Otomatis
    document.getElementById('appTitle').textContent = `SISTEM ABSENSI ${userSession.nama_sekolah ? userSession.nama_sekolah.toUpperCase() : ''}`;
    document.getElementById('userInfo').textContent = `${userSession.nama} (${userSession.role.toUpperCase()})`;

    function logout() { localStorage.clear(); window.location.href = '/index.html'; }

    function switchTab(tabId) {
      document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');

      if (tabId === 'rekapTab') loadRekap();
      if (tabId === 'siswaTab') loadSiswa();
      if (tabId === 'userTab') loadUser();
      if (tabId === 'sekolahTab') loadSekolah();
    }

    // Camera QR Scanner untuk Guru Piket
    let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 220 });
    html5QrcodeScanner.render((code) => {
      fetch('/api/absen-qr', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sekolah_id: userSession.sekolah_id, nisn: code })
      })
      .then(r => r.json())
      .then(d => {
        const res = document.getElementById('scanResult');
        res.style.color = d.success ? 'green' : 'red';
        res.textContent = d.message || d.error;
      });
    });

    // Submit Siswa + Banyak WA
    document.getElementById('formSiswa').addEventListener('submit', (e) => {
      e.preventDefault();
      const listWA = document.getElementById('s_wa').value.split(',');
      fetch('/api/siswa', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          sekolah_id: userSession.sekolah_id,
          nisn: document.getElementById('s_nisn').value,
          nama_siswa: document.getElementById('s_nama').value,
          kelas: document.getElementById('s_kelas').value,
          nama_ortu: document.getElementById('s_ortu').value,
          no_wa_list: listWA
        })
      }).then(() => { alert('Siswa Berhasil Disimpan!'); loadSiswa(); });
    });

    function loadSiswa() {
      fetch(`/api/siswa/${userSession.sekolah_id}`).then(r => r.json()).then(data => {
        const tb = document.getElementById('tabelSiswa');
        tb.innerHTML = '';
        data.forEach(s => {
          tb.innerHTML += `<tr><td>${s.nisn}</td><td>${s.nama_siswa}</td><td>${s.kelas}</td><td>${s.wa_ortu ? s.wa_ortu.join(', ') : '-'}</td></tr>`;
        });
      });
    }

    // Submit User Baru
    document.getElementById('formUser').addEventListener('submit', (e) => {
      e.preventDefault();
      fetch('/api/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('u_username').value,
          password: document.getElementById('u_password').value,
          nama: document.getElementById('u_nama').value,
          role: document.getElementById('u_role').value,
          sekolah_id: userSession.sekolah_id
        })
      }).then(() => { alert('User Berhasil Didaftarkan!'); loadUser(); });
    });

    function loadUser() {
      fetch(`/api/users/${userSession.sekolah_id}`).then(r => r.json()).then(data => {
        const tb = document.getElementById('tabelUser');
        tb.innerHTML = '';
        data.forEach(u => { tb.innerHTML += `<tr><td>${u.username}</td><td>${u.nama}</td><td><span class="badge">${u.role}</span></td></tr>`; });
      });
    }

    // Submit Sekolah Baru
    document.getElementById('formSekolah').addEventListener('submit', (e) => {
      e.preventDefault();
      fetch('/api/sekolah', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nama_sekolah: document.getElementById('sek_nama').value, alamat: document.getElementById('sek_alamat').value })
      }).then(() => { alert('Sekolah Baru Berhasil Ditambahkan!'); loadSekolah(); });
    });

    function loadSekolah() {
      fetch('/api/sekolah').then(r => r.json()).then(data => {
        const tb = document.getElementById('tabelSekolah');
        tb.innerHTML = '';
        data.forEach(s => { tb.innerHTML += `<tr><td>${s.id}</td><td><b>${s.nama_sekolah}</b></td></tr>`; });
      });
    }

    function loadRekap() {
      fetch(`/api/rekap/${userSession.sekolah_id}`).then(r => r.json()).then(data => {
        const tb = document.getElementById('tabelRekap');
        tb.innerHTML = '';
        data.forEach(r => {
          tb.innerHTML += `<tr><td>${r.tanggal.split('T')[0]}</td><td>${r.nama_siswa}</td><td>${r.kelas}</td><td>${r.jam_masuk||'-'}</td><td>${r.jam_pulang||'-'}</td></tr>`;
        });
      });
    }
  </script>
</body>
</html>
